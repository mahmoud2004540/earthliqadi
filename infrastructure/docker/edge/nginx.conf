# Edge reverse proxy (local stand-in for the production load balancer/ingress).
#
# It is the ONLY publicly reachable component. It:
#   * routes /api/* to the API (prefix stripped) and everything else to the web app;
#   * OVERWRITES X-Forwarded-For with the real peer address, so clients cannot
#     spoof their IP (rate limiting and audit logs depend on it). The API trusts
#     exactly one proxy hop (TRUST_PROXY_HOPS=1) and must never be exposed directly;
#   * assigns the request id used for log correlation;
#   * behind Cloudflare (ADR-0023): restores the client IP from CF-Connecting-IP
#     and forwards Cloudflare's location as X-Edge-Country / X-Edge-Region, but
#     ONLY when the connection really comes from a Cloudflare network. From
#     anywhere else both are sent empty, so a client cannot claim a location.
#     The ranges are generated by scripts/update-cloudflare-ips.sh.
# TLS termination is out of scope for local development; production terminates TLS here.

include /etc/nginx/cloudflare/real-ip.inc;
real_ip_header CF-Connecting-IP;

# $realip_remote_addr is the TCP peer before CF-Connecting-IP is applied.
geo $realip_remote_addr $via_cloudflare {
    default 0;
    include /etc/nginx/cloudflare/networks.inc;
}
map $via_cloudflare $edge_country {
    1       $http_cf_ipcountry;
    default "";
}
map $via_cloudflare $edge_region {
    1       $http_cf_region_code;
    default "";
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header X-Edge-Country    $edge_country;
    proxy_set_header X-Edge-Region     $edge_region;
    proxy_set_header CF-IPCountry      "";
    proxy_set_header CF-Region-Code    "";
    proxy_read_timeout 30s;

    # WebSocket market data (ADR-0009): upgrade headers, long-lived reads.
    # NOTE: proxy_set_header in a location REPLACES the server-level set, so the
    # forwarding headers must be repeated here (per-IP WebSocket limits rely on them).
    location = /api/ws {
        proxy_pass http://api:4000/ws;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header X-Edge-Country    $edge_country;
        proxy_set_header X-Edge-Region     $edge_region;
        proxy_set_header CF-IPCountry      "";
        proxy_set_header CF-Region-Code    "";
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin     $http_origin;
        proxy_read_timeout 75s;
    }

    # Prometheus metrics are for the internal scraper only (ADR-0012).
    location ^~ /api/metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:4000/;
    }

    location = /api {
        return 404;
    }

    location / {
        proxy_pass http://web:3000;
    }
}
