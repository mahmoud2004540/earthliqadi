# Prometheus scrape configuration (ADR-0012). The API serves /metrics only with
# a bearer token (METRICS_TOKEN); the public edge never routes it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: exchange-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token # never commit the token
    static_configs:
      - targets: ['api:4000']
