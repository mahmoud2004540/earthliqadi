# Local development stack. NOT a production deployment.
# Usage: cp .env.example .env && docker compose up --build
name: exchange-platform

x-api-env: &api-env
  NODE_ENV: production
  DEPLOY_ENV: local
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BRAND_NAME: ${BRAND_NAME:-Exchange}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET in .env}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in .env}
  PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
  STAFF_MFA_REQUIRED: ${STAFF_MFA_REQUIRED:-true}
  KYC_ENABLED: ${KYC_ENABLED:-false}
  KYC_REQUIRED_FOR_REAL_TRADING: ${KYC_REQUIRED_FOR_REAL_TRADING:-false}
  RESTRICTED_COUNTRIES: ${RESTRICTED_COUNTRIES:-}
  RESTRICTED_SUBDIVISIONS: ${RESTRICTED_SUBDIVISIONS:-}
  GEO_COUNTRY_HEADER: ${GEO_COUNTRY_HEADER:-}
  GEO_REGION_HEADER: ${GEO_REGION_HEADER:-}
  GEO_UNKNOWN_COUNTRY: ${GEO_UNKNOWN_COUNTRY:-allow}
  GEO_RESTRICTED_MODE: ${GEO_RESTRICTED_MODE:-block_all}
  SANCTIONS_SYNC_HOURS: ${SANCTIONS_SYNC_HOURS:-0}
  TERMS_VERSION: ${TERMS_VERSION:-draft-2}
  VALUATION_ASSET: ${VALUATION_ASSET:-USDC}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  CHAIN_RPC_URL: ${CHAIN_RPC_URL:-http://chain:8545}
  CHAIN_OPERATOR_KEY: ${CHAIN_OPERATOR_KEY:-}
  CHAIN_CONFIRMATIONS: ${CHAIN_CONFIRMATIONS:-2}
  CHAIN_FAUCET_ENABLED: ${CHAIN_FAUCET_ENABLED:-false}
  SIGNER_URL: ${SIGNER_URL:-}
  SIGNER_HMAC_SECRET: ${SIGNER_HMAC_SECRET:-}
  STEP_UP_WINDOW_SECONDS: ${STEP_UP_WINDOW_SECONDS:-300}
  ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
  VAULT_STATE_INTERVAL_SECONDS: ${VAULT_STATE_INTERVAL_SECONDS:-300}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  LEDGER_RECONCILIATION_INTERVAL_SECONDS: ${LEDGER_RECONCILIATION_INTERVAL_SECONDS:-300}
  SETTLEMENT_POLL_MS: ${SETTLEMENT_POLL_MS:-250}
  PERP_RISK_POLL_MS: ${PERP_RISK_POLL_MS:-1000}
  MARKET_DATA_POLL_MS: ${MARKET_DATA_POLL_MS:-250}
  RATE_LIMIT_DEFAULT_PER_MINUTE: ${RATE_LIMIT_DEFAULT_PER_MINUTE:-120}
  RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
  ORDER_RATE_LIMIT_PER_SECOND: ${ORDER_RATE_LIMIT_PER_SECOND:-10}
  MAX_OPEN_ORDERS_PER_MARKET: ${MAX_OPEN_ORDERS_PER_MARKET:-200}

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432' # loopback only
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
    command: ['redis-server', '--appendonly', 'yes', '--save', '']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379' # loopback only
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies database migrations, then exits.
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    image: exchange-platform/api:dev
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy']
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Not published: reachable only through the edge proxy, which sets a
  # trustworthy X-Forwarded-For (TRUST_PROXY_HOPS=1).
  api:
    image: exchange-platform/api:dev
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Exchange}
    image: exchange-platform/web:dev
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    restart: unless-stopped

  # Deterministic matching engine (ADR-0007). Single active instance (advisory
  # lock); a second replica would wait as a hot standby. Not published.
  # Local test chain (ADR-0014). Testnet-equivalent; state persisted in a volume.
  chain:
    image: ghcr.io/foundry-rs/foundry@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46
    user: '0'
    entrypoint:
      - anvil
      - --host=0.0.0.0
      - --chain-id=31337
      - --block-time=1
      - --state=/data/anvil-state.json
      - --silent
    ports:
      - '127.0.0.1:8545:8545' # loopback only
    volumes:
      - chain-data:/data
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: infrastructure/docker/engine.Dockerfile
    image: exchange-platform/engine:dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENGINE_POLL_MS: ${ENGINE_POLL_MS:-200}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    restart: unless-stopped

  # Single public entry point: http://localhost:3000
  edge:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    volumes:
      - ./infrastructure/docker/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/docker/edge/cloudflare:/etc/nginx/cloudflare:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:8080' # loopback only
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    restart: unless-stopped

  # Isolated operator signer (ADR-0015). Opt-in locally: docker compose --profile signer up -d signer
  # then set SIGNER_URL=http://signer:4100 and SIGNER_HMAC_SECRET in .env (the API then never uses a local key).
  signer:
    profiles: ['signer']
    build:
      context: .
      dockerfile: infrastructure/docker/signer.Dockerfile
    image: exchange-platform/signer:dev
    environment:
      SIGNER_OPERATOR_KEY: ${SIGNER_OPERATOR_KEY:-}
      SIGNER_HMAC_SECRET: ${SIGNER_HMAC_SECRET:-}
      SIGNER_RPC_URL: ${SIGNER_RPC_URL:-http://chain:8545}
      SIGNER_CHAIN_ID: ${SIGNER_CHAIN_ID:-31337}
      SIGNER_VAULT_ADDRESS: ${SIGNER_VAULT_ADDRESS:-}
      SIGNER_LIMITS: ${SIGNER_LIMITS:-{}}
    volumes:
      - signer-data:/data
    restart: unless-stopped

  # Monitoring (ADR-0015). Opt-in: docker compose --profile monitoring up -d
  # Needs METRICS_TOKEN in .env; scripts/monitoring-up.sh writes the scrape token file.
  prometheus:
    profiles: ['monitoring']
    image: quay.io/prometheus/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 # v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=15d']
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    restart: unless-stopped
  alertmanager:
    profiles: ['monitoring']
    image: quay.io/prometheus/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba # v0.28.1
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes:
      - ./infrastructure/monitoring/alertmanager:/etc/alertmanager:ro
    ports:
      - '127.0.0.1:9093:9093'
    restart: unless-stopped
  grafana:
    profiles: ['monitoring']
    image: grafana/grafana@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d # 12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:3001:3000'
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  chain-data:
  prometheus-data:
  signer-data:
