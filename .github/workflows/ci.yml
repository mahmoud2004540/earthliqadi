name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Format · lint · typecheck · unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  engine:
    name: Matching engine (fmt · clippy · tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/matching-engine
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/matching-engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('services/matching-engine/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  contracts:
    name: Vault contracts (Foundry fmt, build, unit/fuzz/invariant tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: forge fmt --check / build / test (pinned official image)
        working-directory: contracts
        run: |
          docker run --rm -v "$PWD":/work -w /work --entrypoint forge ghcr.io/foundry-rs/foundry@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46 fmt --check
          docker run --rm --user 0 -v "$PWD":/work -w /work --entrypoint forge ghcr.io/foundry-rs/foundry@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46 build --sizes
          docker run --rm --user 0 -v "$PWD":/work -w /work --entrypoint forge ghcr.io/foundry-rs/foundry@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46 test -vv
      - name: Committed API artifacts match the contracts
        run: |
          node contracts/export-artifacts.mjs
          npx --yes prettier@3.9.10 --write apps/api/src/chain/artifacts >/dev/null
          git diff --exit-code apps/api/src/chain/artifacts

  integration:
    name: API integration tests (PostgreSQL + Redis + local chain)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: exchange_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U exchange -d exchange_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.12-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://exchange:ci-only-password@localhost:5432/exchange_test
      TEST_REDIS_URL: redis://localhost:6379/1
      TEST_CHAIN_RPC_URL: http://localhost:8545
      # The vault suite must run in CI (it skips locally when no chain is up).
      TEST_CHAIN_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install pinned Rust toolchain (engine binary is spawned by the tests)
        run: cd services/matching-engine && rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/matching-engine/target
          key: cargo-int-${{ runner.os }}-${{ hashFiles('services/matching-engine/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - name: Start the local test chain (Anvil)
        run: docker run -d --name anvil -p 8545:8545 --entrypoint anvil ghcr.io/foundry-rs/foundry@sha256:043752653d5be351c71709091b3db97c4421c907eb40ea294195e7f532aadf46 --host 0.0.0.0 --chain-id 31337 --block-time 1
      - run: pnpm test:integration

  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/api.Dockerfile -t exchange-platform/api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/web.Dockerfile -t exchange-platform/web:ci .
      - name: Build signer image
        run: docker build -f infrastructure/docker/signer.Dockerfile -t exchange-platform/signer:ci .
      - name: Build engine image
        run: docker build -f infrastructure/docker/engine.Dockerfile -t exchange-platform/engine:ci .
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet

  e2e:
    name: Browser end-to-end (Docker Compose stack + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start stack
        run: cp .env.example .env && docker compose up --build -d
      - name: Wait for edge, API readiness and engine
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health/ready >/dev/null && curl -fsS http://localhost:3000/ >/dev/null \
               && docker compose logs engine | grep -q '"engine ready"'; then exit 0; fi
            sleep 2
          done
          docker compose ps; docker compose logs --tail 100; exit 1
      - name: Install Chromium
        run: pnpm --filter @platform/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 300

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on any high/critical advisory (runtime or tooling).
      - run: pnpm audit --audit-level high
